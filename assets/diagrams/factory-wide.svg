<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img">
  <!-- Preview: open this file in a browser. Wide (this file) and factory-narrow.svg show the same
       picture; change them together. Palette and roles: internal/tui/theme.go.
       Arrows are orthogonal and end on a box edge; the gap between top-lane boxes is 16. -->
  <title>How a brief becomes a merged pull request, and how the factory improves</title>
  <desc>You give the dispatcher a brief. It starts one lead per task, in its own worktree. The lead writes the spec and dispatches an explorer (Haiku), a coder (Sonnet) and a reviewer (Opus) until the reviewer approves. The lander (Sonnet) runs the tests and pushes a pull request, a draft until it is ready: green with no conflict. You approve, and a merge queue script merges it to main in order, every 2 minutes. If the merge hits a conflict or a red check, the tech lead (Opus) resolves it, notes it on the pull request and hands it over again; only if behaviour would change does it go back to the lead. A site manager (Sonnet, every 30 minutes) looks, then tells the dispatcher and the lead. Models are defaults. Kaizen: every task leaves feedback, decisions, a retrospective and its cost; the dispatcher (Fable) proposes rule edits, you decide, and the rules apply to the next task.</desc>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #12111C; }
    .box { fill: #1B1A2B; stroke-width: 1.5; }
    .group { fill: none; stroke: #5C5A75; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .n { font-size: 13.5px; font-weight: 700; }
    .n .m { fill: #8E8BA8; font-weight: 400; }
    .s { font-size: 12.5px; fill: #8E8BA8; }
    .t { font-size: 12.5px; fill: #ECEAF7; }
    .k { font-size: 12.5px; font-weight: 700; fill: #8E8BA8; }
    .arrow, .loop, .aux { fill: none; stroke: #8E8BA8; stroke-width: 1.5; marker-end: url(#a); }
    .loop { stroke-dasharray: 5 4; }
    .aux { stroke-dasharray: 2 3; }
    .dispatcher .box, .lead .box { stroke: #FFD34E; }
    .dispatcher .n, .lead .n { fill: #FFD34E; }
    .explorer .box { stroke: #3FD8C4; }
    .explorer .n { fill: #3FD8C4; }
    .coder .box { stroke: #5E9BFF; }
    .coder .n { fill: #5E9BFF; }
    .reviewer .box { stroke: #FF6FAE; }
    .reviewer .n { fill: #FF6FAE; }
    .lander .box { stroke: #ACD56E; }
    .lander .n { fill: #ACD56E; }
    .human .box { stroke: #ECEAF7; }
    .human .n { fill: #ECEAF7; }
    .pr .box { stroke: #8E8BA8; }
    .pr .n { fill: #ECEAF7; }
    .muted .box { stroke: #8E8BA8; }
    .muted .n { fill: #8E8BA8; }
    .side .box { stroke: #5C5A75; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8E8BA8"/>
    </marker>
  </defs>

  <!-- card -->
  <rect class="bg" width="1040" height="380" rx="12"/>

  <!-- lane titles -->
  <text class="k" x="7" y="20">a task · default models</text>
  <text class="k" x="7" y="364">kaizen 改善</text>

  <!-- top lane, left to right -->
  <path class="arrow" d="M57 118H73"/>
  <path class="arrow" d="M183 118H199"/>
  <path class="arrow" d="M457 118H473"/>
  <path class="arrow" d="M583 118H599"/>
  <path class="arrow" d="M747 118H763"/>
  <path class="arrow" d="M827 118H843"/>
  <path class="arrow" d="M961 118H977"/>

  <!-- you: brief -->
  <g class="human">
    <rect class="box" x="7" y="86" width="50" height="64" rx="8"/>
    <text class="n" x="32" y="114" text-anchor="middle">You</text>
    <text class="t" x="32" y="130" text-anchor="middle">brief</text>
  </g>

  <!-- dispatcher -->
  <g class="dispatcher">
    <rect class="box" x="73" y="86" width="110" height="64" rx="8"/>
    <text class="n" x="128" y="106" text-anchor="middle">Dispatcher</text>
    <text class="s" x="128" y="122" text-anchor="middle">Fable</text>
    <text class="t" x="128" y="138" text-anchor="middle">lead per task</text>
  </g>

  <!-- one task: the lead and the three roles it dispatches -->
  <rect class="group" x="199" y="20" width="258" height="178" rx="10"/>
  <text class="s" x="328" y="38" text-anchor="middle">one task · its own worktree</text>
  <path class="arrow" d="M281 118H305"/>
  <path class="arrow" d="M293 118V74Q293 68 299 68H305"/>
  <path class="arrow" d="M293 118V162Q293 168 299 168H305"/>
  <g class="lead">
    <rect class="box" x="209" y="86" width="72" height="64" rx="8"/>
    <text class="n" x="245" y="106" text-anchor="middle">Lead</text>
    <text class="s" x="245" y="122" text-anchor="middle">Fable</text>
    <text class="t" x="245" y="138" text-anchor="middle">judgment</text>
  </g>
  <g class="explorer">
    <rect class="box" x="305" y="48" width="142" height="40" rx="8"/>
    <text class="n" x="376" y="65" text-anchor="middle">explorer<tspan class="m"> · Haiku</tspan></text>
    <text class="t" x="376" y="80" text-anchor="middle">reads</text>
  </g>
  <g class="coder">
    <rect class="box" x="305" y="98" width="142" height="40" rx="8"/>
    <text class="n" x="376" y="115" text-anchor="middle">coder<tspan class="m"> · Sonnet</tspan></text>
    <text class="t" x="376" y="130" text-anchor="middle">writes</text>
  </g>
  <g class="reviewer">
    <rect class="box" x="305" y="148" width="142" height="40" rx="8"/>
    <text class="n" x="376" y="165" text-anchor="middle">reviewer<tspan class="m"> · Opus</tspan></text>
    <text class="t" x="376" y="180" text-anchor="middle">until APPROVE</text>
  </g>

  <!-- lander: tests, pushes -->
  <g class="lander">
    <rect class="box" x="473" y="86" width="110" height="64" rx="8"/>
    <text class="n" x="528" y="106" text-anchor="middle">Lander</text>
    <text class="s" x="528" y="122" text-anchor="middle">Sonnet</text>
    <text class="t" x="528" y="138" text-anchor="middle">tests, pushes</text>
  </g>

  <!-- pull request: draft, then ready -->
  <g class="pr">
    <rect class="box" x="599" y="86" width="148" height="64" rx="8"/>
    <text class="n" x="673" y="106" text-anchor="middle">Pull request</text>
    <text class="s" x="673" y="122" text-anchor="middle">draft → ready</text>
    <text class="t" x="673" y="138" text-anchor="middle">green, no conflict</text>
  </g>

  <!-- you: approve -->
  <g class="human">
    <rect class="box" x="763" y="86" width="64" height="64" rx="8"/>
    <text class="n" x="795" y="114" text-anchor="middle">You</text>
    <text class="t" x="795" y="130" text-anchor="middle">approve</text>
  </g>

  <!-- merge queue: a script merges in order -->
  <g class="muted">
    <rect class="box" x="843" y="86" width="118" height="64" rx="8"/>
    <text class="n" x="902" y="106" text-anchor="middle">Merge queue</text>
    <text class="s" x="902" y="122" text-anchor="middle">script · 2 min</text>
    <text class="t" x="902" y="138" text-anchor="middle">in order</text>
  </g>

  <!-- main -->
  <g class="lander">
    <rect class="box" x="977" y="86" width="56" height="64" rx="8"/>
    <text class="n" x="1005" y="122" text-anchor="middle">main</text>
  </g>

  <!-- side notes, each under what it touches -->
  <path class="aux" d="M128 214V150"/>
  <path class="aux" d="M225 214V150"/>
  <g class="side muted">
    <rect class="box" x="70" y="214" width="170" height="64" rx="8"/>
    <text class="n" x="155" y="234" text-anchor="middle">site manager</text>
    <text class="s" x="155" y="250" text-anchor="middle">Sonnet · 30 min</text>
    <text class="t" x="155" y="266" text-anchor="middle">looks, then tells</text>
  </g>

  <!-- tech lead: conflict or red from the merge queue, and the way back -->
  <path class="arrow" d="M925 150V214"/>
  <text class="s" x="917" y="186" text-anchor="end">conflict or red</text>
  <path class="arrow" d="M735 214V150"/>
  <path class="aux" d="M720 246H265V150"/>
  <text class="s" x="492" y="238" text-anchor="middle">only if behaviour would change</text>
  <g class="side muted">
    <rect class="box" x="720" y="214" width="220" height="64" rx="8"/>
    <text class="n" x="830" y="234" text-anchor="middle">tech lead<tspan class="m"> · Opus</tspan></text>
    <text class="s" x="830" y="250" text-anchor="middle">resolves, notes on PR</text>
    <text class="t" x="830" y="266" text-anchor="middle">hands over again</text>
  </g>

  <!-- bottom lane, right to left: kaizen -->
  <path class="loop" d="M1005 150V306"/>
  <path class="loop" d="M863 338H847"/>
  <path class="loop" d="M687 338H671"/>
  <path class="loop" d="M575 338H559"/>
  <path class="loop" d="M345 338H32V150"/>
  <g class="muted">
    <rect class="box" x="863" y="306" width="170" height="64" rx="8"/>
    <text class="s" x="948" y="326" text-anchor="middle">every task leaves</text>
    <text class="t" x="948" y="342" text-anchor="middle">feedback · decisions</text>
    <text class="t" x="948" y="358" text-anchor="middle">retrospective · cost</text>
  </g>
  <g class="dispatcher">
    <rect class="box" x="687" y="306" width="160" height="64" rx="8"/>
    <text class="n" x="767" y="326" text-anchor="middle">Dispatcher</text>
    <text class="s" x="767" y="342" text-anchor="middle">Fable</text>
    <text class="t" x="767" y="358" text-anchor="middle">proposes rule edits</text>
  </g>
  <g class="human">
    <rect class="box" x="575" y="306" width="96" height="64" rx="8"/>
    <text class="n" x="623" y="334" text-anchor="middle">You</text>
    <text class="t" x="623" y="350" text-anchor="middle">decide</text>
  </g>
  <g class="muted">
    <rect class="box" x="345" y="306" width="214" height="64" rx="8"/>
    <text class="n" x="452" y="343" text-anchor="middle">rules for the next task</text>
  </g>
</svg>
