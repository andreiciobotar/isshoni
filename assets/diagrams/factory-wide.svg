<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 604" role="img">
  <!-- Preview: open this file in a browser. Wide (this file) and factory-narrow.svg show the same
       picture; change them together. Palette and roles: internal/tui/theme.go.
       Arrows are orthogonal and end on a box edge; every box text has at least 8 px to each edge.
       Two tiers: the factory on top (dispatcher, site manager, lander, main), one task below it.
       You is a bar across the top: you work across the whole factory, so each relation with you is a
       short straight arrow down or up; the one to the pull request passes the top tier right of main.
       A task is two peers on one row, same top and height (the lead with its explorer below, the tech
       lead with its three helpers below), then the pull request. The lander is a script for every task,
       so it stands outside the task. The kaizen loop leaves the task along the bottom and enters the
       dispatcher; its title and words sit under that run. -->
  <title>How a brief becomes a merged pull request, and how the factory improves</title>
  <desc>You give the dispatcher a brief; it starts each task as two sessions in one worktree. The lead (Fable) writes the spec, with an explorer (Haiku) for its questions, and hands it to the tech lead (Opus). The tech lead builds: an explorer (Haiku) reads, a coder (Sonnet) writes, a reviewer (Opus) checks until it approves; then it tests and pushes a pull request, a draft until it is handed over, green and free of conflicts. The lead judges the build and hands it over. You comment on the pull request, which reaches the lead, and you approve it. The lander, one script across every task, runs every 2 minutes and merges approved pull requests to main in order. What conflicts or fails a check there goes back to the tech lead, which resolves it and hands over again, and asks the lead only if behaviour would change. A site manager (Sonnet, every 30 minutes) watches, and tells the dispatcher (always when main is red) or a lead. Every task leaves feedback, decisions, a retrospective and its cost with the same dispatcher (Fable), which proposes rule edits; you decide. Models are defaults.</desc>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #12111C; }
    .box { fill: #1B1A2B; stroke-width: 1.5; }
    .group { fill: none; stroke: #5C5A75; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .n { font-size: 13.5px; font-weight: 700; }
    .n .m { fill: #8E8BA8; font-weight: 400; }
    .s { font-size: 12.5px; fill: #8E8BA8; }
    .t { font-size: 12.5px; fill: #ECEAF7; }
    .k { font-size: 12.5px; font-weight: 700; fill: #8E8BA8; }
    .arrow, .loop, .aux { fill: none; stroke: #8E8BA8; stroke-width: 1.5; marker-end: url(#a); }
    .loop { stroke-dasharray: 5 4; }
    .aux { stroke-dasharray: 2 3; }
    .dispatcher .box, .lead .box { stroke: #FFD34E; }
    .dispatcher .n, .lead .n { fill: #FFD34E; }
    .explorer .box { stroke: #3FD8C4; }
    .explorer .n { fill: #3FD8C4; }
    .coder .box { stroke: #5E9BFF; }
    .coder .n { fill: #5E9BFF; }
    .reviewer .box { stroke: #FF6FAE; }
    .reviewer .n { fill: #FF6FAE; }
    .lander .box { stroke: #ACD56E; }
    .lander .n { fill: #ACD56E; }
    .human .box { stroke: #ECEAF7; }
    .human .n { fill: #ECEAF7; }
    .pr .box { stroke: #8E8BA8; }
    .pr .n { fill: #ECEAF7; }
    .muted .box { stroke: #8E8BA8; }
    .muted .n { fill: #8E8BA8; }
    .side .box { stroke: #5C5A75; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8E8BA8"/>
    </marker>
  </defs>

  <!-- card -->
  <rect class="bg" width="708" height="604" rx="12"/>

  <!-- you: a bar across the top -->
  <g class="human">
    <rect class="box" x="10" y="8" width="688" height="30" rx="8"/>
    <text class="n" x="24" y="28">You</text>
  </g>
  <path class="arrow" d="M40 38V84"/>
  <text class="t" x="48" y="66">brief</text>
  <path class="loop" d="M120 84V38"/>
  <text class="s" x="128" y="58">proposes rule edits,</text>
  <text class="s" x="128" y="72">you decide</text>
  <path class="arrow" d="M674 38V246"/>
  <text class="t" x="666" y="66" text-anchor="end">comments · approve</text>

  <!-- top tier: the factory -->
  <g class="dispatcher">
    <rect class="box" x="20" y="84" width="130" height="64" rx="8"/>
    <text class="n" x="85" y="108" text-anchor="middle">Dispatcher</text>
    <text class="s" x="85" y="124" text-anchor="middle">Fable</text>
    <text class="t" x="85" y="140" text-anchor="middle">a lead per task</text>
  </g>
  <path class="arrow" d="M108 148V246"/>

  <!-- site manager: red main to the dispatcher, what the lead can fix to the lead -->
  <path class="aux" d="M238 116H150"/>
  <text class="s" x="194" y="110" text-anchor="middle">red main</text>
  <path class="aux" d="M298 148V176H148V246"/>
  <text class="s" x="223" y="170" text-anchor="middle">what it can fix</text>
  <g class="side muted">
    <rect class="box" x="238" y="84" width="146" height="64" rx="8"/>
    <text class="n" x="311" y="108" text-anchor="middle">site manager</text>
    <text class="s" x="311" y="124" text-anchor="middle">Sonnet · 30 min</text>
    <text class="t" x="311" y="140" text-anchor="middle">looks, then tells</text>
  </g>

  <!-- the lander: one script for every task; what conflicts or fails goes back to the tech lead -->
  <g class="lander">
    <rect class="box" x="448" y="84" width="136" height="80" rx="8"/>
    <text class="n" x="516" y="108" text-anchor="middle">Lander</text>
    <text class="s" x="516" y="124" text-anchor="middle">script · 2 min</text>
    <text class="t" x="516" y="140" text-anchor="middle">merges approved,</text>
    <text class="t" x="516" y="156" text-anchor="middle">in order</text>
  </g>
  <path class="arrow" d="M584 116H604"/>
  <g class="lander">
    <rect class="box" x="604" y="84" width="50" height="64" rx="8"/>
    <text class="n" x="629" y="120" text-anchor="middle">main</text>
  </g>
  <path class="arrow" d="M468 164V246"/>
  <text class="s" x="460" y="180" text-anchor="end">conflict or</text>
  <text class="s" x="460" y="194" text-anchor="end">failed check</text>
  <path class="arrow" d="M573 246V164"/>

  <!-- the task hangs below: the lead and the tech lead side by side, each with its helpers below -->
  <rect class="group" x="56" y="208" width="642" height="330" rx="10"/>
  <text class="s" x="648" y="526" text-anchor="end">one task of many · its own worktree</text>

  <!-- lead and its explorer -->
  <g class="lead">
    <rect class="box" x="64" y="246" width="146" height="106" rx="8"/>
    <text class="n" x="137" y="278" text-anchor="middle">Lead</text>
    <text class="s" x="137" y="294" text-anchor="middle">Fable</text>
    <text class="t" x="137" y="310" text-anchor="middle">spec, judges,</text>
    <text class="t" x="137" y="326" text-anchor="middle">hands over</text>
  </g>
  <path class="arrow" d="M137 352V372"/>
  <g class="explorer">
    <rect class="box" x="64" y="372" width="146" height="40" rx="8"/>
    <text class="n" x="137" y="389" text-anchor="middle">explorer<tspan class="m"> · Haiku</tspan></text>
    <text class="t" x="137" y="404" text-anchor="middle">reads</text>
  </g>

  <!-- lead and tech lead: the spec, the build, and the later question -->
  <path class="arrow" d="M210 258H320"/>
  <text class="s" x="265" y="253" text-anchor="middle">spec</text>
  <path class="arrow" d="M320 280H210"/>
  <text class="s" x="265" y="275" text-anchor="middle">the build</text>
  <path class="aux" d="M320 340H210"/>
  <text class="s" x="265" y="300" text-anchor="middle">later: only</text>
  <text class="s" x="265" y="314" text-anchor="middle">if behaviour</text>
  <text class="s" x="265" y="328" text-anchor="middle">would change</text>

  <!-- tech lead and the three it dispatches -->
  <path class="arrow" d="M348 352V384Q348 388 352 388H372"/>
  <path class="arrow" d="M348 352V432Q348 436 352 436H372"/>
  <path class="arrow" d="M348 352V480Q348 484 352 484H372"/>
  <g class="lead">
    <rect class="box" x="320" y="246" width="198" height="106" rx="8"/>
    <text class="n" x="419" y="278" text-anchor="middle">Tech lead<tspan class="m"> · Opus</tspan></text>
    <text class="t" x="419" y="294" text-anchor="middle">builds, tests, pushes</text>
    <text class="s" x="419" y="310" text-anchor="middle">afterwards</text>
    <text class="t" x="419" y="326" text-anchor="middle">conflicts, failed checks</text>
  </g>
  <g class="explorer">
    <rect class="box" x="372" y="372" width="146" height="40" rx="8"/>
    <text class="n" x="445" y="389" text-anchor="middle">explorer<tspan class="m"> · Haiku</tspan></text>
    <text class="t" x="445" y="404" text-anchor="middle">reads</text>
  </g>
  <g class="coder">
    <rect class="box" x="372" y="420" width="146" height="40" rx="8"/>
    <text class="n" x="445" y="437" text-anchor="middle">coder<tspan class="m"> · Sonnet</tspan></text>
    <text class="t" x="445" y="452" text-anchor="middle">writes</text>
  </g>
  <g class="reviewer">
    <rect class="box" x="372" y="468" width="146" height="40" rx="8"/>
    <text class="n" x="445" y="485" text-anchor="middle">reviewer<tspan class="m"> · Opus</tspan></text>
    <text class="t" x="445" y="500" text-anchor="middle">until APPROVE</text>
  </g>

  <!-- pull request: draft, then ready; your comments reach the lead -->
  <path class="arrow" d="M518 278H538"/>
  <g class="pr">
    <rect class="box" x="538" y="246" width="152" height="64" rx="8"/>
    <text class="n" x="614" y="266" text-anchor="middle">Pull request</text>
    <text class="s" x="614" y="282" text-anchor="middle">draft → ready</text>
    <text class="t" x="614" y="298" text-anchor="middle">green, no conflict</text>
  </g>
  <path class="aux" d="M553 246V234H190V246"/>
  <text class="s" x="371" y="226" text-anchor="middle">your comments</text>

  <!-- kaizen: from the task back into the dispatcher -->
  <path class="loop" d="M128 538V560H38V148"/>
  <text class="k" x="20" y="580">kaizen 改善</text>
  <text class="t" x="118" y="580">every task leaves feedback ·</text>
  <text class="t" x="118" y="594">decisions · retrospective · cost</text>
</svg>
