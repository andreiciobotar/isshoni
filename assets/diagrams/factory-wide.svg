<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 380" role="img">
  <!-- Preview: open this file in a browser. Wide (this file) and factory-narrow.svg show the same
       picture; change them together. Palette and roles: internal/tui/theme.go.
       Arrows are orthogonal and end on a box edge; the gap between top-lane boxes is 16. -->
  <title>How a brief becomes a merged pull request, and how the factory improves</title>
  <desc>You give the dispatcher a brief. It starts one lead per task, in its own worktree. The lead writes the spec and dispatches an explorer (Haiku), a coder (Sonnet) and a reviewer (Opus) until the reviewer approves. The lander (Sonnet) runs the tests and pushes a pull request, a draft until it is handed over with checks green. You approve with a review or a comment lgtm, and the lander merges it to main within about two minutes. A watcher script flips the pull request from draft to ready when it is handed over and green; a courier (Haiku) carries your pull request comments to the lead; a site manager (Sonnet, every 30 minutes) watches and escalates to the dispatcher. Models are defaults. Kaizen: every task leaves feedback, decisions, a retrospective and its cost; the dispatcher proposes rule edits, you decide, and the rules apply to the next task.</desc>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #12111C; }
    .box { fill: #1B1A2B; stroke-width: 1.5; }
    .group { fill: none; stroke: #5C5A75; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .n { font-size: 13.5px; font-weight: 700; }
    .n .m { fill: #8E8BA8; font-weight: 400; }
    .s { font-size: 12.5px; fill: #8E8BA8; }
    .t { font-size: 12.5px; fill: #ECEAF7; }
    .k { font-size: 12.5px; font-weight: 700; fill: #8E8BA8; }
    .arrow, .loop, .aux { fill: none; stroke: #8E8BA8; stroke-width: 1.5; marker-end: url(#a); }
    .loop { stroke-dasharray: 5 4; }
    .aux { stroke-dasharray: 2 3; }
    .dispatcher .box, .lead .box { stroke: #FFD34E; }
    .dispatcher .n, .lead .n { fill: #FFD34E; }
    .explorer .box { stroke: #3FD8C4; }
    .explorer .n { fill: #3FD8C4; }
    .coder .box { stroke: #5E9BFF; }
    .coder .n { fill: #5E9BFF; }
    .reviewer .box { stroke: #FF6FAE; }
    .reviewer .n { fill: #FF6FAE; }
    .lander .box { stroke: #ACD56E; }
    .lander .n { fill: #ACD56E; }
    .human .box { stroke: #ECEAF7; }
    .human .n { fill: #ECEAF7; }
    .pr .box { stroke: #8E8BA8; }
    .pr .n { fill: #ECEAF7; }
    .muted .box { stroke: #8E8BA8; }
    .muted .n { fill: #8E8BA8; }
    .side .box { stroke: #5C5A75; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8E8BA8"/>
    </marker>
  </defs>

  <!-- card -->
  <rect class="bg" width="1012" height="380" rx="12"/>

  <!-- lane titles -->
  <text class="k" x="10" y="20">a task · default models</text>
  <text class="k" x="10" y="364">kaizen 改善</text>

  <!-- top lane, left to right -->
  <path class="arrow" d="M66 118H82"/>
  <path class="arrow" d="M202 118H218"/>
  <path class="arrow" d="M486 118H502"/>
  <path class="arrow" d="M622 118H638"/>
  <path class="arrow" d="M754 118H770"/>
  <path class="arrow" d="M870 118H886"/>

  <!-- you: brief -->
  <g class="human">
    <rect class="box" x="10" y="86" width="56" height="64" rx="8"/>
    <text class="n" x="38" y="114" text-anchor="middle">You</text>
    <text class="t" x="38" y="130" text-anchor="middle">brief</text>
  </g>

  <!-- dispatcher -->
  <g class="dispatcher">
    <rect class="box" x="82" y="86" width="120" height="64" rx="8"/>
    <text class="n" x="142" y="106" text-anchor="middle">Dispatcher</text>
    <text class="s" x="142" y="122" text-anchor="middle">Fable</text>
    <text class="t" x="142" y="138" text-anchor="middle">lead per task</text>
  </g>

  <!-- one task: the lead and the three roles it dispatches -->
  <rect class="group" x="218" y="20" width="268" height="178" rx="10"/>
  <text class="s" x="352" y="38" text-anchor="middle">one task · its own worktree</text>
  <path class="arrow" d="M298 118H330"/>
  <path class="arrow" d="M314 118V76Q314 68 322 68H330"/>
  <path class="arrow" d="M314 118V160Q314 168 322 168H330"/>
  <g class="lead">
    <rect class="box" x="228" y="86" width="70" height="64" rx="8"/>
    <text class="n" x="263" y="106" text-anchor="middle">Lead</text>
    <text class="s" x="263" y="122" text-anchor="middle">Fable</text>
    <text class="t" x="263" y="138" text-anchor="middle">judgment</text>
  </g>
  <g class="explorer">
    <rect class="box" x="330" y="48" width="146" height="40" rx="8"/>
    <text class="n" x="403" y="65" text-anchor="middle">explorer<tspan class="m"> · Haiku</tspan></text>
    <text class="t" x="403" y="80" text-anchor="middle">reads</text>
  </g>
  <g class="coder">
    <rect class="box" x="330" y="98" width="146" height="40" rx="8"/>
    <text class="n" x="403" y="115" text-anchor="middle">coder<tspan class="m"> · Sonnet</tspan></text>
    <text class="t" x="403" y="130" text-anchor="middle">writes</text>
  </g>
  <g class="reviewer">
    <rect class="box" x="330" y="148" width="146" height="40" rx="8"/>
    <text class="n" x="403" y="165" text-anchor="middle">reviewer<tspan class="m"> · Opus</tspan></text>
    <text class="t" x="403" y="180" text-anchor="middle">until APPROVE</text>
  </g>

  <!-- lander: tests, pushes -->
  <g class="lander">
    <rect class="box" x="502" y="86" width="120" height="64" rx="8"/>
    <text class="n" x="562" y="106" text-anchor="middle">Lander</text>
    <text class="s" x="562" y="122" text-anchor="middle">Sonnet</text>
    <text class="t" x="562" y="138" text-anchor="middle">tests, pushes</text>
  </g>

  <!-- pull request: draft, then ready -->
  <g class="pr">
    <rect class="box" x="638" y="86" width="116" height="64" rx="8"/>
    <text class="n" x="696" y="106" text-anchor="middle">Pull request</text>
    <text class="s" x="696" y="122" text-anchor="middle">draft → ready</text>
    <text class="t" x="696" y="138" text-anchor="middle">checks green</text>
  </g>

  <!-- you: approve -->
  <g class="human">
    <rect class="box" x="770" y="86" width="100" height="64" rx="8"/>
    <text class="n" x="816" y="106" text-anchor="middle">You</text>
    <text class="s" x="816" y="122" text-anchor="middle">approve:</text>
    <text class="t" x="816" y="138" text-anchor="middle">review/lgtm</text>
  </g>

  <!-- main, reached by the lander's merge -->
  <g class="lander">
    <rect class="box" x="886" y="86" width="116" height="64" rx="8"/>
    <text class="n" x="936" y="106" text-anchor="middle">main</text>
    <text class="s" x="936" y="122" text-anchor="middle">lander merges</text>
    <text class="t" x="936" y="138" text-anchor="middle">in ~2 min</text>
  </g>

  <!-- side notes, each under what it touches -->
  <path class="aux" d="M142 214V150"/>
  <g class="side muted">
    <rect class="box" x="67" y="214" width="150" height="64" rx="8"/>
    <text class="n" x="142" y="234" text-anchor="middle">site manager</text>
    <text class="s" x="142" y="250" text-anchor="middle">Sonnet · 30 min</text>
    <text class="t" x="142" y="266" text-anchor="middle">watches, escalates</text>
  </g>
  <!-- courier: pull request, then your comments to the lead -->
  <path class="aux" d="M650 150V246H622"/>
  <path class="aux" d="M502 246H263V150"/>
  <g class="side muted">
    <rect class="box" x="502" y="214" width="120" height="64" rx="8"/>
    <text class="n" x="562" y="234" text-anchor="middle">courier</text>
    <text class="s" x="562" y="250" text-anchor="middle">Haiku</text>
    <text class="t" x="562" y="266" text-anchor="middle">your comments</text>
  </g>
  <path class="aux" d="M736 214V150"/>
  <g class="side muted">
    <rect class="box" x="676" y="214" width="120" height="64" rx="8"/>
    <text class="n" x="736" y="234" text-anchor="middle">watcher</text>
    <text class="s" x="736" y="250" text-anchor="middle">script</text>
    <text class="t" x="736" y="266" text-anchor="middle">draft → ready</text>
  </g>

  <!-- bottom lane, right to left: kaizen -->
  <path class="loop" d="M944 150V306"/>
  <path class="loop" d="M790 338H774"/>
  <path class="loop" d="M614 338H598"/>
  <path class="loop" d="M502 338H486"/>
  <path class="loop" d="M218 338H38V150"/>
  <g class="muted">
    <rect class="box" x="790" y="306" width="212" height="64" rx="8"/>
    <text class="s" x="892" y="326" text-anchor="middle">every task leaves</text>
    <text class="t" x="892" y="342" text-anchor="middle">feedback · decisions</text>
    <text class="t" x="892" y="358" text-anchor="middle">retrospective · cost</text>
  </g>
  <g class="dispatcher">
    <rect class="box" x="614" y="306" width="160" height="64" rx="8"/>
    <text class="n" x="694" y="326" text-anchor="middle">Dispatcher</text>
    <text class="s" x="694" y="342" text-anchor="middle">Fable</text>
    <text class="t" x="694" y="358" text-anchor="middle">proposes rule edits</text>
  </g>
  <g class="human">
    <rect class="box" x="502" y="306" width="96" height="64" rx="8"/>
    <text class="n" x="550" y="334" text-anchor="middle">You</text>
    <text class="t" x="550" y="350" text-anchor="middle">decide</text>
  </g>
  <g class="muted">
    <rect class="box" x="218" y="306" width="268" height="64" rx="8"/>
    <text class="n" x="352" y="343" text-anchor="middle">rules for the next task</text>
  </g>
</svg>
