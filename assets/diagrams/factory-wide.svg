<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 516" role="img">
  <!-- Preview: open this file in a browser. Wide (this file) and factory-narrow.svg show the same
       picture; change them together. Palette and roles: internal/tui/theme.go.
       Arrows are orthogonal and end on a box edge; every box text has at least 8 px to each edge.
       You is a bar across the top: you work across the whole factory, so each relation with you is a
       short straight arrow down or up. One row below it: the dispatcher, one task, the lander, main.
       A task is two peers on one row, same top and height (the lead with its explorer below, the tech
       lead with its three helpers below), then the pull request. The lander is a script for every task,
       so it stands outside the task. The kaizen loop leaves the task along the bottom and enters the
       dispatcher; the site manager sits below the dispatcher. -->
  <title>How a brief becomes a merged pull request, and how the factory improves</title>
  <desc>You give the dispatcher a brief; it starts each task as two sessions in one worktree. The lead (Fable) writes the spec, with an explorer (Haiku) for its questions, and hands it to the tech lead (Opus). The tech lead builds: an explorer (Haiku) reads, a coder (Sonnet) writes, a reviewer (Opus) checks until it approves; then it tests and pushes a pull request, a draft until it is handed over, green and free of conflicts. The lead judges the build and hands it over. You comment on the pull request, which reaches the lead, and you approve it. The lander, one script across every task that runs every 2 minutes, merges approved pull requests to main in order. What conflicts or fails a check there goes back to the tech lead, which resolves it and hands over again, and asks the lead only if behaviour would change. A site manager (Sonnet, every 30 minutes) watches, and tells the dispatcher (always when main is red) or a lead. Every task leaves feedback, decisions, a retrospective and its cost with the same dispatcher (Fable), which proposes rule edits; you decide. Models are defaults.</desc>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #12111C; }
    .box { fill: #1B1A2B; stroke-width: 1.5; }
    .group { fill: none; stroke: #5C5A75; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .n { font-size: 13.5px; font-weight: 700; }
    .n .m { fill: #8E8BA8; font-weight: 400; }
    .s { font-size: 12.5px; fill: #8E8BA8; }
    .t { font-size: 12.5px; fill: #ECEAF7; }
    .k { font-size: 12.5px; font-weight: 700; fill: #8E8BA8; }
    .arrow, .loop, .aux { fill: none; stroke: #8E8BA8; stroke-width: 1.5; marker-end: url(#a); }
    .loop { stroke-dasharray: 5 4; }
    .aux { stroke-dasharray: 2 3; }
    .dispatcher .box, .lead .box { stroke: #FFD34E; }
    .dispatcher .n, .lead .n { fill: #FFD34E; }
    .explorer .box { stroke: #3FD8C4; }
    .explorer .n { fill: #3FD8C4; }
    .coder .box { stroke: #5E9BFF; }
    .coder .n { fill: #5E9BFF; }
    .reviewer .box { stroke: #FF6FAE; }
    .reviewer .n { fill: #FF6FAE; }
    .lander .box { stroke: #ACD56E; }
    .lander .n { fill: #ACD56E; }
    .human .box { stroke: #ECEAF7; }
    .human .n { fill: #ECEAF7; }
    .pr .box { stroke: #8E8BA8; }
    .pr .n { fill: #ECEAF7; }
    .muted .box { stroke: #8E8BA8; }
    .muted .n { fill: #8E8BA8; }
    .side .box { stroke: #5C5A75; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8E8BA8"/>
    </marker>
  </defs>

  <!-- card -->
  <rect class="bg" width="1084" height="516" rx="12"/>

  <!-- you: a bar across the top -->
  <g class="human">
    <rect class="box" x="10" y="8" width="1064" height="30" rx="8"/>
    <text class="n" x="24" y="28">You</text>
  </g>
  <path class="arrow" d="M44 38V118"/>
  <text class="t" x="52" y="62">brief</text>
  <path class="loop" d="M124 118V38"/>
  <text class="s" x="132" y="62">proposes rule edits</text>
  <text class="s" x="132" y="76">decides</text>
  <path class="arrow" d="M802 38V118"/>
  <text class="t" x="794" y="62" text-anchor="end">comments · approve</text>

  <!-- dispatcher -->
  <path class="arrow" d="M154 150H204"/>
  <g class="dispatcher">
    <rect class="box" x="24" y="118" width="130" height="64" rx="8"/>
    <text class="n" x="89" y="142" text-anchor="middle">Dispatcher</text>
    <text class="s" x="89" y="158" text-anchor="middle">Fable</text>
    <text class="t" x="89" y="174" text-anchor="middle">a lead per task</text>
  </g>

  <!-- one task: the lead and the tech lead side by side, each with its helpers below -->
  <rect class="group" x="176" y="84" width="670" height="316" rx="10"/>
  <text class="s" x="188" y="392">one task of many · its own worktree</text>

  <!-- lead and its explorer -->
  <path class="arrow" d="M277 224V244"/>
  <g class="lead">
    <rect class="box" x="204" y="118" width="146" height="106" rx="8"/>
    <text class="n" x="277" y="142" text-anchor="middle">Lead</text>
    <text class="s" x="277" y="158" text-anchor="middle">Fable</text>
    <text class="t" x="277" y="174" text-anchor="middle">spec, judges,</text>
    <text class="t" x="277" y="190" text-anchor="middle">hands over</text>
  </g>
  <g class="explorer">
    <rect class="box" x="204" y="244" width="146" height="40" rx="8"/>
    <text class="n" x="277" y="261" text-anchor="middle">explorer<tspan class="m"> · Haiku</tspan></text>
    <text class="t" x="277" y="276" text-anchor="middle">reads</text>
  </g>

  <!-- lead and tech lead: the spec, the build, and the later question -->
  <path class="arrow" d="M350 140H462"/>
  <text class="s" x="406" y="135" text-anchor="middle">spec</text>
  <path class="arrow" d="M462 162H350"/>
  <text class="s" x="406" y="157" text-anchor="middle">the build</text>
  <path class="aux" d="M462 218H350"/>
  <text class="s" x="406" y="182" text-anchor="middle">later: only</text>
  <text class="s" x="406" y="196" text-anchor="middle">if behaviour</text>
  <text class="s" x="406" y="210" text-anchor="middle">would change</text>

  <!-- tech lead and the three it dispatches -->
  <path class="arrow" d="M488 224V260Q488 264 492 264H512"/>
  <path class="arrow" d="M488 224V308Q488 312 492 312H512"/>
  <path class="arrow" d="M488 224V356Q488 360 492 360H512"/>
  <g class="lead">
    <rect class="box" x="462" y="118" width="200" height="106" rx="8"/>
    <text class="n" x="562" y="142" text-anchor="middle">Tech lead<tspan class="m"> · Opus</tspan></text>
    <text class="t" x="562" y="160" text-anchor="middle">builds, tests, pushes</text>
    <text class="s" x="562" y="176" text-anchor="middle">afterwards</text>
    <text class="t" x="562" y="192" text-anchor="middle">conflicts, failed checks</text>
  </g>
  <g class="explorer">
    <rect class="box" x="512" y="244" width="150" height="40" rx="8"/>
    <text class="n" x="587" y="261" text-anchor="middle">explorer<tspan class="m"> · Haiku</tspan></text>
    <text class="t" x="587" y="276" text-anchor="middle">reads</text>
  </g>
  <g class="coder">
    <rect class="box" x="512" y="292" width="150" height="40" rx="8"/>
    <text class="n" x="587" y="309" text-anchor="middle">coder<tspan class="m"> · Sonnet</tspan></text>
    <text class="t" x="587" y="324" text-anchor="middle">writes</text>
  </g>
  <g class="reviewer">
    <rect class="box" x="512" y="340" width="150" height="40" rx="8"/>
    <text class="n" x="587" y="357" text-anchor="middle">reviewer<tspan class="m"> · Opus</tspan></text>
    <text class="t" x="587" y="372" text-anchor="middle">until APPROVE</text>
  </g>

  <!-- pull request: draft, then ready; your comments reach the lead -->
  <path class="arrow" d="M662 150H686"/>
  <g class="pr">
    <rect class="box" x="686" y="118" width="152" height="64" rx="8"/>
    <text class="n" x="762" y="142" text-anchor="middle">Pull request</text>
    <text class="s" x="762" y="158" text-anchor="middle">draft → ready</text>
    <text class="t" x="762" y="174" text-anchor="middle">green, no conflict</text>
  </g>
  <path class="aux" d="M712 118V104H277V118"/>
  <text class="s" x="490" y="99" text-anchor="middle">your comments</text>

  <!-- the lander: one script for every task; what conflicts or fails goes back to the tech lead -->
  <path class="arrow" d="M838 150H862"/>
  <g class="lander">
    <rect class="box" x="862" y="118" width="140" height="80" rx="8"/>
    <text class="n" x="932" y="142" text-anchor="middle">Lander</text>
    <text class="s" x="932" y="158" text-anchor="middle">script · 2 min</text>
    <text class="t" x="932" y="174" text-anchor="middle">merges approved,</text>
    <text class="t" x="932" y="190" text-anchor="middle">in order</text>
  </g>
  <path class="arrow" d="M932 198V428H474V224"/>
  <text class="s" x="702" y="421" text-anchor="middle">conflict or failed check</text>
  <path class="arrow" d="M1002 150H1024"/>

  <!-- main -->
  <g class="lander">
    <rect class="box" x="1024" y="118" width="50" height="64" rx="8"/>
    <text class="n" x="1049" y="154" text-anchor="middle">main</text>
  </g>

  <!-- site manager: red main to the dispatcher, what the lead can fix to the lead -->
  <path class="aux" d="M50 292V182"/>
  <text class="s" x="58" y="238">red main</text>
  <path class="aux" d="M168 324H190V200H204"/>
  <text class="s" x="170" y="268" text-anchor="end">what it</text>
  <text class="s" x="170" y="282" text-anchor="end">can fix</text>
  <g class="side muted">
    <rect class="box" x="24" y="292" width="144" height="64" rx="8"/>
    <text class="n" x="96" y="316" text-anchor="middle">site manager</text>
    <text class="s" x="96" y="332" text-anchor="middle">Sonnet · 30 min</text>
    <text class="t" x="96" y="348" text-anchor="middle">looks, then tells</text>
  </g>

  <!-- kaizen: from the task back into the dispatcher -->
  <path class="loop" d="M300 400V500H10V150H24"/>
  <text class="k" x="24" y="494">kaizen 改善</text>
  <text class="s" x="308" y="448">every task leaves</text>
  <text class="t" x="308" y="462">feedback · decisions</text>
  <text class="t" x="308" y="476">retrospective · cost</text>
</svg>
