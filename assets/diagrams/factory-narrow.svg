<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1314" role="img">
  <!-- Preview: open this file in a browser. Narrow (this file, for phones) and factory-wide.svg show
       the same picture; change them together. Palette and roles: internal/tui/theme.go.
       GitHub's phone column is about 358 px wide, so this viewBox is 360 wide and shows at about 1:1.
       A task is two peers on one row, same top and height: the lead on the left with its explorer
       below, the tech lead on the right with its four roles below. Three arrows join the two; the
       comments line to the lead comes up the gap between them. The left strip (x 6 to 40) carries the
       dotted lines up to the dispatcher and the lead; the merge queue's line to the tech lead runs
       up the right margin at x 352. -->
  <title>How a brief becomes a merged pull request, and how the factory improves</title>
  <desc>You give the dispatcher a brief. It starts each task as two sessions in one worktree. The lead (Fable) writes the spec, judges the build and hands it over, and dispatches only an explorer (Haiku). It hands the spec to the tech lead (Opus), which builds and sends the build back to the lead. The tech lead dispatches an explorer (Haiku) that reads, a coder (Sonnet) that writes, a reviewer (Opus) until it approves, and a lander (Sonnet) that runs the tests and pushes. The pull request is a draft until it is ready: green with no conflict. You approve, and a merge queue script merges it to main in order, every 2 minutes. A pull request that conflicts or fails a check there goes back to the tech lead, which resolves it, notes it on the pull request and hands it over again; later, only if behaviour would change, it asks the lead. Your comments on the pull request reach the lead. A site manager (Sonnet, every 30 minutes) looks, then tells the dispatcher when main is red, or the lead what it can fix. Models are defaults. Kaizen: every task leaves feedback, decisions, a retrospective and its cost; the dispatcher (Fable) proposes rule edits, you decide, and the rules apply to the next task.</desc>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #12111C; }
    .box { fill: #1B1A2B; stroke-width: 1.5; }
    .group { fill: none; stroke: #5C5A75; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .n { font-size: 13px; font-weight: 700; }
    .n .m { fill: #8E8BA8; font-weight: 400; }
    .s { font-size: 11.5px; fill: #8E8BA8; }
    .t { font-size: 11.5px; fill: #ECEAF7; }
    .k { font-size: 12px; font-weight: 700; fill: #8E8BA8; }
    .arrow, .loop, .aux { fill: none; stroke: #8E8BA8; stroke-width: 1.5; marker-end: url(#a); }
    .loop { stroke-dasharray: 5 4; }
    .aux { stroke-dasharray: 2 3; }
    .dispatcher .box, .lead .box { stroke: #FFD34E; }
    .dispatcher .n, .lead .n { fill: #FFD34E; }
    .explorer .box { stroke: #3FD8C4; }
    .explorer .n { fill: #3FD8C4; }
    .coder .box { stroke: #5E9BFF; }
    .coder .n { fill: #5E9BFF; }
    .reviewer .box { stroke: #FF6FAE; }
    .reviewer .n { fill: #FF6FAE; }
    .lander .box { stroke: #ACD56E; }
    .lander .n { fill: #ACD56E; }
    .human .box { stroke: #ECEAF7; }
    .human .n { fill: #ECEAF7; }
    .pr .box { stroke: #8E8BA8; }
    .pr .n { fill: #ECEAF7; }
    .muted .box { stroke: #8E8BA8; }
    .muted .n { fill: #8E8BA8; }
    .side .box { stroke: #5C5A75; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8E8BA8"/>
    </marker>
  </defs>

  <!-- card -->
  <rect class="bg" width="360" height="1314" rx="12"/>

  <text class="k" x="16" y="16">a task · default models</text>

  <!-- you: brief -->
  <g class="human">
    <rect class="box" x="36" y="28" width="50" height="56" rx="8"/>
    <text class="n" x="61" y="52" text-anchor="middle">You</text>
    <text class="t" x="61" y="70" text-anchor="middle">brief</text>
  </g>
  <path class="arrow" d="M86 56H100"/>

  <!-- dispatcher -->
  <g class="dispatcher">
    <rect class="box" x="100" y="28" width="230" height="56" rx="8"/>
    <text class="n" x="215" y="52" text-anchor="middle">Dispatcher<tspan class="m"> · Fable</tspan></text>
    <text class="t" x="215" y="70" text-anchor="middle">lead per task</text>
  </g>
  <path class="arrow" d="M124 84V164"/>

  <!-- one task: the lead and the tech lead side by side, each with its helpers below -->
  <rect class="group" x="40" y="124" width="298" height="540" rx="10"/>
  <text class="s" x="330" y="140" text-anchor="end">one task · its own worktree</text>

  <!-- lead and its explorer -->
  <path class="arrow" d="M91 322V342"/>
  <g class="lead">
    <rect class="box" x="48" y="164" width="86" height="158" rx="8"/>
    <text class="n" x="91" y="215" text-anchor="middle">Lead</text>
    <text class="s" x="91" y="231" text-anchor="middle">Fable</text>
    <text class="t" x="91" y="247" text-anchor="middle">spec,</text>
    <text class="t" x="91" y="263" text-anchor="middle">judges,</text>
    <text class="t" x="91" y="279" text-anchor="middle">hands over</text>
  </g>
  <g class="explorer">
    <rect class="box" x="48" y="342" width="86" height="64" rx="8"/>
    <text class="n" x="91" y="362" text-anchor="middle">explorer</text>
    <text class="s" x="91" y="378" text-anchor="middle">Haiku</text>
    <text class="t" x="91" y="394" text-anchor="middle">reads</text>
  </g>

  <!-- lead and tech lead: the spec, the build, and the later question -->
  <path class="arrow" d="M134 180H210"/>
  <text class="s" x="172" y="175" text-anchor="middle">spec</text>
  <path class="arrow" d="M210 200H134"/>
  <text class="s" x="172" y="195" text-anchor="middle">the build</text>
  <path class="aux" d="M210 280H134"/>
  <text class="s" x="172" y="220" text-anchor="middle">later:</text>
  <text class="s" x="172" y="233" text-anchor="middle">only if</text>
  <text class="s" x="172" y="246" text-anchor="middle">behaviour</text>
  <text class="s" x="172" y="259" text-anchor="middle">would</text>
  <text class="s" x="172" y="272" text-anchor="middle">change</text>

  <!-- tech lead and the four it dispatches -->
  <path class="arrow" d="M236 322V370Q236 374 240 374H250"/>
  <path class="arrow" d="M236 322V442Q236 446 240 446H250"/>
  <path class="arrow" d="M236 322V522Q236 526 240 526H250"/>
  <path class="arrow" d="M236 322V610Q236 614 240 614H250"/>
  <g class="lead">
    <rect class="box" x="210" y="164" width="120" height="158" rx="8"/>
    <text class="n" x="270" y="199" text-anchor="middle">Tech lead</text>
    <text class="s" x="270" y="215" text-anchor="middle">Opus</text>
    <text class="t" x="270" y="231" text-anchor="middle">builds,</text>
    <text class="t" x="270" y="247" text-anchor="middle">lands the PR</text>
    <text class="s" x="270" y="263" text-anchor="middle">afterwards</text>
    <text class="t" x="270" y="279" text-anchor="middle">conflicts,</text>
    <text class="t" x="270" y="295" text-anchor="middle">failed checks</text>
  </g>
  <g class="explorer">
    <rect class="box" x="250" y="342" width="80" height="64" rx="8"/>
    <text class="n" x="290" y="362" text-anchor="middle">explorer</text>
    <text class="s" x="290" y="378" text-anchor="middle">Haiku</text>
    <text class="t" x="290" y="394" text-anchor="middle">reads</text>
  </g>
  <g class="coder">
    <rect class="box" x="250" y="414" width="80" height="64" rx="8"/>
    <text class="n" x="290" y="434" text-anchor="middle">coder</text>
    <text class="s" x="290" y="450" text-anchor="middle">Sonnet</text>
    <text class="t" x="290" y="466" text-anchor="middle">writes</text>
  </g>
  <g class="reviewer">
    <rect class="box" x="250" y="486" width="80" height="80" rx="8"/>
    <text class="n" x="290" y="506" text-anchor="middle">reviewer</text>
    <text class="s" x="290" y="522" text-anchor="middle">Opus</text>
    <text class="t" x="290" y="538" text-anchor="middle">until</text>
    <text class="t" x="290" y="554" text-anchor="middle">APPROVE</text>
  </g>
  <g class="lander">
    <rect class="box" x="250" y="574" width="80" height="80" rx="8"/>
    <text class="n" x="290" y="594" text-anchor="middle">lander</text>
    <text class="s" x="290" y="610" text-anchor="middle">Sonnet</text>
    <text class="t" x="290" y="626" text-anchor="middle">tests,</text>
    <text class="t" x="290" y="642" text-anchor="middle">pushes</text>
  </g>

  <!-- the tech lead hands over again; the lander hands the pull request over -->
  <path class="arrow" d="M222 322V722"/>
  <text class="s" x="216" y="338" text-anchor="end">hands</text>
  <text class="s" x="216" y="351" text-anchor="end">over</text>
  <text class="s" x="216" y="364" text-anchor="end">again</text>
  <path class="arrow" d="M262 654V722"/>

  <!-- pull request: draft, then ready -->
  <g class="pr">
    <rect class="box" x="188" y="722" width="142" height="64" rx="8"/>
    <text class="n" x="259" y="742" text-anchor="middle">Pull request</text>
    <text class="s" x="259" y="758" text-anchor="middle">draft → ready</text>
    <text class="t" x="259" y="774" text-anchor="middle">green, no conflict</text>
  </g>
  <path class="aux" d="M188 754H156V308H134"/>
  <text class="s" x="150" y="500" text-anchor="end">your</text>
  <text class="s" x="150" y="513" text-anchor="end">comments</text>
  <path class="arrow" d="M259 786V814"/>

  <!-- you: approve -->
  <g class="human">
    <rect class="box" x="188" y="814" width="142" height="56" rx="8"/>
    <text class="n" x="259" y="838" text-anchor="middle">You</text>
    <text class="t" x="259" y="856" text-anchor="middle">approve</text>
  </g>
  <path class="arrow" d="M259 870V898"/>

  <!-- merge queue: a script merges in order; what conflicts or fails goes to the tech lead -->
  <g class="muted">
    <rect class="box" x="188" y="898" width="142" height="64" rx="8"/>
    <text class="n" x="259" y="918" text-anchor="middle">Merge queue</text>
    <text class="s" x="259" y="934" text-anchor="middle">script · 2 min</text>
    <text class="t" x="259" y="950" text-anchor="middle">in order</text>
  </g>
  <path class="arrow" d="M330 930H352V308H330"/>
  <text class="s" x="346" y="682" text-anchor="end">conflict</text>
  <text class="s" x="346" y="695" text-anchor="end">or failed</text>
  <text class="s" x="346" y="708" text-anchor="end">check</text>
  <path class="arrow" d="M274 962V990"/>

  <!-- main -->
  <g class="lander">
    <rect class="box" x="218" y="990" width="112" height="44" rx="8"/>
    <text class="n" x="274" y="1017" text-anchor="middle">main</text>
  </g>
  <path class="loop" d="M274 1034V1088"/>

  <!-- site manager: red main to the dispatcher, what the lead can fix to the lead -->
  <g class="side muted">
    <rect class="box" x="40" y="990" width="134" height="64" rx="8"/>
    <text class="n" x="107" y="1010" text-anchor="middle">site manager</text>
    <text class="s" x="107" y="1026" text-anchor="middle">Sonnet · 30 min</text>
    <text class="t" x="107" y="1042" text-anchor="middle">looks, then tells</text>
  </g>
  <path class="aux" d="M40 1022H17V108H110V84"/>
  <text class="s" x="24" y="102">red main</text>
  <path class="aux" d="M58 108V164"/>
  <text class="s" x="66" y="137">what</text>
  <text class="s" x="66" y="149">it can</text>
  <text class="s" x="66" y="161">fix</text>

  <!-- kaizen lane, stacked -->
  <text class="k" x="16" y="1078">kaizen 改善</text>
  <g class="muted">
    <rect class="box" x="16" y="1088" width="314" height="64" rx="8"/>
    <text class="s" x="173" y="1108" text-anchor="middle">every task leaves</text>
    <text class="t" x="173" y="1124" text-anchor="middle">feedback · decisions</text>
    <text class="t" x="173" y="1140" text-anchor="middle">retrospective · cost</text>
  </g>
  <path class="loop" d="M91 1152V1170"/>
  <g class="dispatcher">
    <rect class="box" x="16" y="1170" width="150" height="64" rx="8"/>
    <text class="n" x="91" y="1190" text-anchor="middle">Dispatcher</text>
    <text class="s" x="91" y="1206" text-anchor="middle">Fable</text>
    <text class="t" x="91" y="1222" text-anchor="middle">proposes rule edits</text>
  </g>
  <path class="loop" d="M166 1202H184"/>
  <g class="human">
    <rect class="box" x="184" y="1170" width="146" height="64" rx="8"/>
    <text class="n" x="257" y="1198" text-anchor="middle">You</text>
    <text class="t" x="257" y="1214" text-anchor="middle">decide</text>
  </g>
  <path class="loop" d="M257 1234V1252"/>
  <g class="muted">
    <rect class="box" x="16" y="1252" width="314" height="44" rx="8"/>
    <text class="n" x="173" y="1279" text-anchor="middle">rules for the next task</text>
  </g>
  <!-- the loop closes into the start of the flow -->
  <path class="loop" d="M16 1274H6V56H36"/>
</svg>
