<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 852" role="img">
  <!-- Preview: open this file in a browser. Narrow (this file, for phones) and factory-wide.svg show
       the same picture; change them together. Palette and roles: internal/tui/theme.go.
       GitHub's phone column is about 358 px wide, so this viewBox is 360 wide and shows at about 1:1.
       You is a rail down the left edge: you work across the whole factory, so each relation with you
       is a short straight arrow from the rail. The dispatcher is at the top right with the site manager
       below it. A task is two peers on one row, same top and height (the lead with its explorer below,
       the tech lead with its three helpers below), with the pull request under the lead. The lander is
       a script for every task, so it stands below the task, with main under it; its line to the tech
       lead comes up between the pull request and the helpers. The kaizen loop leaves the task at the
       bottom and runs up the right margin (x 352) into the dispatcher. -->
  <title>How a brief becomes a merged pull request, and how the factory improves</title>
  <desc>You give the dispatcher a brief; it starts each task as two sessions in one worktree. The lead (Fable) writes the spec, with an explorer (Haiku) for its questions, and hands it to the tech lead (Opus). The tech lead builds: an explorer (Haiku) reads, a coder (Sonnet) writes, a reviewer (Opus) checks until it approves; then it tests and pushes a pull request, a draft until it is handed over, green and free of conflicts. The lead judges the build and hands it over. You comment on the pull request, which reaches the lead, and you approve it. The lander, one script across every task that runs every 2 minutes, merges approved pull requests to main in order. What conflicts or fails a check there goes back to the tech lead, which resolves it and hands over again, and asks the lead only if behaviour would change. A site manager (Sonnet, every 30 minutes) watches, and tells the dispatcher (always when main is red) or a lead. Every task leaves feedback, decisions, a retrospective and its cost with the same dispatcher (Fable), which proposes rule edits; you decide. Models are defaults.</desc>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #12111C; }
    .box { fill: #1B1A2B; stroke-width: 1.5; }
    .group { fill: none; stroke: #5C5A75; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .n { font-size: 13px; font-weight: 700; }
    .n .m { fill: #8E8BA8; font-weight: 400; }
    .s { font-size: 11.5px; fill: #8E8BA8; }
    .t { font-size: 11.5px; fill: #ECEAF7; }
    .k { font-size: 12px; font-weight: 700; fill: #8E8BA8; }
    .arrow, .loop, .aux { fill: none; stroke: #8E8BA8; stroke-width: 1.5; marker-end: url(#a); }
    .loop { stroke-dasharray: 5 4; }
    .aux { stroke-dasharray: 2 3; }
    .dispatcher .box, .lead .box { stroke: #FFD34E; }
    .dispatcher .n, .lead .n { fill: #FFD34E; }
    .explorer .box { stroke: #3FD8C4; }
    .explorer .n { fill: #3FD8C4; }
    .coder .box { stroke: #5E9BFF; }
    .coder .n { fill: #5E9BFF; }
    .reviewer .box { stroke: #FF6FAE; }
    .reviewer .n { fill: #FF6FAE; }
    .lander .box { stroke: #ACD56E; }
    .lander .n { fill: #ACD56E; }
    .human .box { stroke: #ECEAF7; }
    .human .n { fill: #ECEAF7; }
    .pr .box { stroke: #8E8BA8; }
    .pr .n { fill: #ECEAF7; }
    .muted .box { stroke: #8E8BA8; }
    .muted .n { fill: #8E8BA8; }
    .side .box { stroke: #5C5A75; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8E8BA8"/>
    </marker>
  </defs>

  <!-- card -->
  <rect class="bg" width="360" height="852" rx="12"/>

  <!-- you: a rail down the left edge -->
  <g class="human">
    <rect class="box" x="6" y="8" width="40" height="836" rx="8"/>
    <text class="n" x="26" y="32" text-anchor="middle">You</text>
  </g>
  <path class="arrow" d="M46 40H196"/>
  <text class="t" x="121" y="35" text-anchor="middle">brief</text>
  <path class="loop" d="M196 62H46"/>
  <text class="s" x="121" y="57" text-anchor="middle">proposes rule edits</text>
  <text class="s" x="54" y="77">decides</text>
  <path class="arrow" d="M46 532H78V560"/>
  <text class="t" x="60" y="508">comments ·</text>
  <text class="t" x="60" y="521">approve</text>

  <!-- dispatcher -->
  <g class="dispatcher">
    <rect class="box" x="196" y="20" width="144" height="76" rx="8"/>
    <text class="n" x="268" y="44" text-anchor="middle">Dispatcher</text>
    <text class="s" x="268" y="60" text-anchor="middle">Fable</text>
    <text class="t" x="268" y="76" text-anchor="middle">a lead per task</text>
  </g>
  <path class="arrow" d="M196 86H125V228"/>

  <!-- site manager: red main to the dispatcher, what the lead can fix to the lead -->
  <path class="aux" d="M250 116V96"/>
  <text class="s" x="258" y="110">red main</text>
  <path class="aux" d="M206 148H135V228"/>
  <text class="s" x="144" y="126">what it</text>
  <text class="s" x="144" y="139">can fix</text>
  <g class="side muted">
    <rect class="box" x="206" y="116" width="134" height="64" rx="8"/>
    <text class="n" x="273" y="136" text-anchor="middle">site manager</text>
    <text class="s" x="273" y="152" text-anchor="middle">Sonnet · 30 min</text>
    <text class="t" x="273" y="168" text-anchor="middle">looks, then tells</text>
  </g>

  <!-- one task: the lead and the tech lead side by side, each with its helpers below -->
  <rect class="group" x="54" y="204" width="292" height="464" rx="10"/>
  <text class="s" x="100" y="640">one task of many ·</text>
  <text class="s" x="100" y="653">its own worktree</text>

  <!-- lead and its explorer -->
  <path class="arrow" d="M105 400V420"/>
  <g class="lead">
    <rect class="box" x="62" y="228" width="86" height="172" rx="8"/>
    <text class="n" x="105" y="268" text-anchor="middle">Lead</text>
    <text class="s" x="105" y="284" text-anchor="middle">Fable</text>
    <text class="t" x="105" y="300" text-anchor="middle">spec,</text>
    <text class="t" x="105" y="316" text-anchor="middle">judges,</text>
    <text class="t" x="105" y="332" text-anchor="middle">hands over</text>
  </g>
  <g class="explorer">
    <rect class="box" x="62" y="420" width="86" height="64" rx="8"/>
    <text class="n" x="105" y="440" text-anchor="middle">explorer</text>
    <text class="s" x="105" y="456" text-anchor="middle">Haiku</text>
    <text class="t" x="105" y="472" text-anchor="middle">reads</text>
  </g>

  <!-- lead and tech lead: the spec, the build, and the later question -->
  <path class="arrow" d="M148 248H214"/>
  <text class="s" x="181" y="243" text-anchor="middle">spec</text>
  <path class="arrow" d="M214 268H148"/>
  <text class="s" x="181" y="263" text-anchor="middle">the build</text>
  <path class="aux" d="M214 352H148"/>
  <text class="s" x="181" y="288" text-anchor="middle">later:</text>
  <text class="s" x="181" y="301" text-anchor="middle">only if</text>
  <text class="s" x="181" y="314" text-anchor="middle">behaviour</text>
  <text class="s" x="181" y="327" text-anchor="middle">would</text>
  <text class="s" x="181" y="340" text-anchor="middle">change</text>

  <!-- tech lead and the three it dispatches -->
  <path class="arrow" d="M244 400V448Q244 452 248 452H258"/>
  <path class="arrow" d="M244 400V520Q244 524 248 524H258"/>
  <path class="arrow" d="M244 400V600Q244 604 248 604H258"/>
  <g class="lead">
    <rect class="box" x="214" y="228" width="124" height="172" rx="8"/>
    <text class="n" x="276" y="268" text-anchor="middle">Tech lead</text>
    <text class="s" x="276" y="284" text-anchor="middle">Opus</text>
    <text class="t" x="276" y="300" text-anchor="middle">builds, tests,</text>
    <text class="t" x="276" y="316" text-anchor="middle">pushes</text>
    <text class="s" x="276" y="332" text-anchor="middle">afterwards</text>
    <text class="t" x="276" y="348" text-anchor="middle">conflicts,</text>
    <text class="t" x="276" y="364" text-anchor="middle">failed checks</text>
  </g>
  <g class="explorer">
    <rect class="box" x="258" y="420" width="80" height="64" rx="8"/>
    <text class="n" x="298" y="440" text-anchor="middle">explorer</text>
    <text class="s" x="298" y="456" text-anchor="middle">Haiku</text>
    <text class="t" x="298" y="472" text-anchor="middle">reads</text>
  </g>
  <g class="coder">
    <rect class="box" x="258" y="492" width="80" height="64" rx="8"/>
    <text class="n" x="298" y="512" text-anchor="middle">coder</text>
    <text class="s" x="298" y="528" text-anchor="middle">Sonnet</text>
    <text class="t" x="298" y="544" text-anchor="middle">writes</text>
  </g>
  <g class="reviewer">
    <rect class="box" x="258" y="564" width="80" height="80" rx="8"/>
    <text class="n" x="298" y="584" text-anchor="middle">reviewer</text>
    <text class="s" x="298" y="600" text-anchor="middle">Opus</text>
    <text class="t" x="298" y="616" text-anchor="middle">until</text>
    <text class="t" x="298" y="632" text-anchor="middle">APPROVE</text>
  </g>

  <!-- pull request: draft, then ready; your comments reach the lead -->
  <path class="arrow" d="M224 400V592H202"/>
  <g class="pr">
    <rect class="box" x="62" y="560" width="140" height="64" rx="8"/>
    <text class="n" x="132" y="580" text-anchor="middle">Pull request</text>
    <text class="s" x="132" y="596" text-anchor="middle">draft → ready</text>
    <text class="t" x="132" y="612" text-anchor="middle">green, no conflict</text>
  </g>
  <path class="aux" d="M156 560V384H148"/>
  <text class="s" x="162" y="430">your</text>
  <text class="s" x="162" y="443">comments</text>
  <path class="arrow" d="M90 624V692"/>

  <!-- the lander: one script for every task; what conflicts or fails goes back to the tech lead -->
  <g class="lander">
    <rect class="box" x="62" y="692" width="140" height="80" rx="8"/>
    <text class="n" x="132" y="712" text-anchor="middle">Lander</text>
    <text class="s" x="132" y="728" text-anchor="middle">script · 2 min</text>
    <text class="t" x="132" y="744" text-anchor="middle">merges approved,</text>
    <text class="t" x="132" y="760" text-anchor="middle">in order</text>
  </g>
  <path class="arrow" d="M202 716H234V400"/>
  <text class="s" x="242" y="712">conflict</text>
  <text class="s" x="242" y="725">or failed</text>
  <text class="s" x="242" y="738">check</text>
  <path class="arrow" d="M132 772V792"/>

  <!-- main -->
  <g class="lander">
    <rect class="box" x="62" y="792" width="120" height="44" rx="8"/>
    <text class="n" x="122" y="819" text-anchor="middle">main</text>
  </g>

  <!-- kaizen: from the task back into the dispatcher -->
  <path class="loop" d="M318 668V748H352V52H340"/>
  <text class="k" x="346" y="764" text-anchor="end">kaizen 改善</text>
  <text class="s" x="346" y="777" text-anchor="end">every task leaves</text>
  <text class="t" x="346" y="790" text-anchor="end">feedback · decisions</text>
  <text class="t" x="346" y="803" text-anchor="end">retrospective · cost</text>
</svg>
