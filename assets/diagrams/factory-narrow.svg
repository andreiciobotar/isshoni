<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 1152" role="img">
  <!-- Preview: open this file in a browser. Narrow (this file, for phones) and factory-wide.svg show
       the same picture; change them together. Palette and roles: internal/tui/theme.go.
       GitHub's phone column is 324 px wide, so this viewBox is 330 wide and shows at about 1:1.
       The left strip (x 6 to 40) carries the dotted lines up to the lead and the dispatcher,
       and the line from the merge queue to the tech lead; the right strip (x 322) the comments. -->
  <title>How a brief becomes a merged pull request, and how the factory improves</title>
  <desc>You give the dispatcher a brief. It starts one task, a team of two sessions in one worktree. The lead (Fable) writes the spec, judges the result and reports, and dispatches only an explorer (Haiku). It hands the spec to the tech lead (Opus), which builds and lands the pull request: it dispatches an explorer (Haiku) that reads, a coder (Sonnet) that writes, a reviewer (Opus) until it approves, and a lander (Sonnet) that runs the tests and pushes. The pull request is a draft until it is ready: green with no conflict. You approve, and a merge queue script merges it to main in order, every 2 minutes. A pull request that conflicts or fails a check there goes back to the tech lead, which resolves it, notes it on the pull request and hands it over again; only if behaviour would change does it ask the lead. Your comments on the pull request reach the lead. A site manager (Sonnet, every 30 minutes) looks, then tells the dispatcher when main is red, or the lead. Models are defaults. Kaizen: every task leaves feedback, decisions, a retrospective and its cost; the dispatcher (Fable) proposes rule edits, you decide, and the rules apply to the next task.</desc>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #12111C; }
    .box { fill: #1B1A2B; stroke-width: 1.5; }
    .group { fill: none; stroke: #5C5A75; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .n { font-size: 13px; font-weight: 700; }
    .n .m { fill: #8E8BA8; font-weight: 400; }
    .s { font-size: 11.5px; fill: #8E8BA8; }
    .t { font-size: 11.5px; fill: #ECEAF7; }
    .k { font-size: 12px; font-weight: 700; fill: #8E8BA8; }
    .arrow, .loop, .aux { fill: none; stroke: #8E8BA8; stroke-width: 1.5; marker-end: url(#a); }
    .loop { stroke-dasharray: 5 4; }
    .aux { stroke-dasharray: 2 3; }
    .join { marker-end: none; }
    .dispatcher .box, .lead .box { stroke: #FFD34E; }
    .dispatcher .n, .lead .n { fill: #FFD34E; }
    .explorer .box { stroke: #3FD8C4; }
    .explorer .n { fill: #3FD8C4; }
    .coder .box { stroke: #5E9BFF; }
    .coder .n { fill: #5E9BFF; }
    .reviewer .box { stroke: #FF6FAE; }
    .reviewer .n { fill: #FF6FAE; }
    .lander .box { stroke: #ACD56E; }
    .lander .n { fill: #ACD56E; }
    .human .box { stroke: #ECEAF7; }
    .human .n { fill: #ECEAF7; }
    .pr .box { stroke: #8E8BA8; }
    .pr .n { fill: #ECEAF7; }
    .muted .box { stroke: #8E8BA8; }
    .muted .n { fill: #8E8BA8; }
    .side .box { stroke: #5C5A75; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8E8BA8"/>
    </marker>
  </defs>

  <!-- card -->
  <rect class="bg" width="330" height="1152" rx="12"/>

  <text class="k" x="16" y="16">a task · default models</text>

  <!-- you: brief -->
  <g class="human">
    <rect class="box" x="40" y="28" width="54" height="56" rx="8"/>
    <text class="n" x="67" y="52" text-anchor="middle">You</text>
    <text class="t" x="67" y="70" text-anchor="middle">brief</text>
  </g>
  <path class="arrow" d="M94 56H108"/>

  <!-- dispatcher -->
  <g class="dispatcher">
    <rect class="box" x="108" y="28" width="206" height="56" rx="8"/>
    <text class="n" x="211" y="52" text-anchor="middle">Dispatcher<tspan class="m"> · Fable</tspan></text>
    <text class="t" x="211" y="70" text-anchor="middle">lead per task</text>
  </g>
  <path class="arrow" d="M140 84V164"/>

  <!-- one task: the lead above, the tech lead and its four roles below -->
  <rect class="group" x="40" y="124" width="274" height="388" rx="10"/>
  <text class="s" x="306" y="140" text-anchor="end">one task ·</text>
  <text class="s" x="306" y="153" text-anchor="end">its own worktree</text>
  <path class="arrow" d="M148 212H168"/>
  <g class="lead">
    <rect class="box" x="48" y="164" width="100" height="96" rx="8"/>
    <text class="n" x="98" y="184" text-anchor="middle">Lead</text>
    <text class="s" x="98" y="200" text-anchor="middle">Fable</text>
    <text class="t" x="98" y="216" text-anchor="middle">spec,</text>
    <text class="t" x="98" y="232" text-anchor="middle">judgement,</text>
    <text class="t" x="98" y="248" text-anchor="middle">report</text>
  </g>
  <g class="explorer">
    <rect class="box" x="168" y="192" width="138" height="40" rx="8"/>
    <text class="n" x="174" y="209">explorer<tspan class="m"> · Haiku</tspan></text>
    <text class="t" x="174" y="224">reads</text>
  </g>

  <!-- lead to tech lead: the spec, and the way back -->
  <path class="arrow" d="M70 260V324"/>
  <text class="s" x="78" y="296">spec</text>
  <path class="aux" d="M130 324V260"/>
  <text class="s" x="138" y="282">only if</text>
  <text class="s" x="138" y="296">behaviour</text>
  <text class="s" x="138" y="310">would change</text>

  <!-- tech lead and the four it dispatches -->
  <path class="arrow" d="M148 388H168"/>
  <path class="arrow" d="M156 388V346Q156 340 162 340H168"/>
  <path class="arrow" d="M156 388V430Q156 436 162 436H168"/>
  <path class="arrow" d="M156 388V478Q156 484 162 484H168"/>
  <g class="lead">
    <rect class="box" x="48" y="324" width="100" height="128" rx="8"/>
    <text class="n" x="98" y="344" text-anchor="middle">tech lead</text>
    <text class="s" x="98" y="360" text-anchor="middle">Opus</text>
    <text class="t" x="98" y="376" text-anchor="middle">builds,</text>
    <text class="t" x="98" y="392" text-anchor="middle">lands the PR</text>
    <text class="s" x="98" y="408" text-anchor="middle">afterwards:</text>
    <text class="t" x="98" y="424" text-anchor="middle">conflicts,</text>
    <text class="t" x="98" y="440" text-anchor="middle">failed checks</text>
  </g>
  <g class="explorer">
    <rect class="box" x="168" y="320" width="138" height="40" rx="8"/>
    <text class="n" x="174" y="337">explorer<tspan class="m"> · Haiku</tspan></text>
    <text class="t" x="174" y="352">reads</text>
  </g>
  <g class="coder">
    <rect class="box" x="168" y="368" width="138" height="40" rx="8"/>
    <text class="n" x="174" y="385">coder<tspan class="m"> · Sonnet</tspan></text>
    <text class="t" x="174" y="400">writes</text>
  </g>
  <g class="reviewer">
    <rect class="box" x="168" y="416" width="138" height="40" rx="8"/>
    <text class="n" x="174" y="433">reviewer<tspan class="m"> · Opus</tspan></text>
    <text class="t" x="174" y="448">until APPROVE</text>
  </g>
  <g class="lander">
    <rect class="box" x="168" y="464" width="138" height="40" rx="8"/>
    <text class="n" x="174" y="481">lander<tspan class="m"> · Sonnet</tspan></text>
    <text class="t" x="174" y="496">tests, pushes</text>
  </g>
  <path class="arrow" d="M270 504V560"/>

  <!-- the tech lead hands over again -->
  <path class="arrow" d="M130 452V538H190V560"/>
  <text class="s" x="138" y="530">hands over again</text>

  <!-- pull request: draft, then ready -->
  <g class="pr">
    <rect class="box" x="166" y="560" width="148" height="64" rx="8"/>
    <text class="n" x="240" y="580" text-anchor="middle">Pull request</text>
    <text class="s" x="240" y="596" text-anchor="middle">draft → ready</text>
    <text class="t" x="240" y="612" text-anchor="middle">green, no conflict</text>
  </g>
  <path class="aux" d="M314 592H322V246H148"/>
  <text class="s" x="250" y="260" text-anchor="middle">your comments</text>
  <path class="arrow" d="M240 624V652"/>

  <!-- you: approve -->
  <g class="human">
    <rect class="box" x="166" y="652" width="148" height="56" rx="8"/>
    <text class="n" x="240" y="676" text-anchor="middle">You</text>
    <text class="t" x="240" y="694" text-anchor="middle">approve</text>
  </g>
  <path class="arrow" d="M240 708V736"/>

  <!-- merge queue: a script merges in order; what conflicts or fails goes to the tech lead -->
  <g class="muted">
    <rect class="box" x="166" y="736" width="148" height="64" rx="8"/>
    <text class="n" x="240" y="756" text-anchor="middle">Merge queue</text>
    <text class="s" x="240" y="772" text-anchor="middle">script · 2 min</text>
    <text class="t" x="240" y="788" text-anchor="middle">in order</text>
  </g>
  <path class="arrow" d="M166 768H64V452"/>
  <text class="s" x="72" y="742">conflict or</text>
  <text class="s" x="72" y="756">failed check</text>
  <path class="arrow" d="M258 800V828"/>

  <!-- main -->
  <g class="lander">
    <rect class="box" x="202" y="828" width="112" height="44" rx="8"/>
    <text class="n" x="258" y="855" text-anchor="middle">main</text>
  </g>
  <path class="loop" d="M258 872V926"/>

  <!-- site manager, and the dotted lines up to the lead and the dispatcher -->
  <g class="side muted">
    <rect class="box" x="40" y="828" width="146" height="64" rx="8"/>
    <text class="n" x="113" y="848" text-anchor="middle">site manager</text>
    <text class="s" x="113" y="864" text-anchor="middle">Sonnet · 30 min</text>
    <text class="t" x="113" y="880" text-anchor="middle">looks, then tells</text>
  </g>
  <path class="aux" d="M40 860H17V108H120V84"/>
  <text class="s" x="44" y="102">red main</text>
  <path class="aux" d="M17 228H48"/>

  <!-- kaizen lane, stacked -->
  <text class="k" x="16" y="916">kaizen 改善</text>
  <g class="muted">
    <rect class="box" x="16" y="926" width="298" height="64" rx="8"/>
    <text class="s" x="165" y="946" text-anchor="middle">every task leaves</text>
    <text class="t" x="165" y="962" text-anchor="middle">feedback · decisions</text>
    <text class="t" x="165" y="978" text-anchor="middle">retrospective · cost</text>
  </g>
  <path class="loop" d="M91 990V1008"/>
  <g class="dispatcher">
    <rect class="box" x="16" y="1008" width="150" height="64" rx="8"/>
    <text class="n" x="91" y="1028" text-anchor="middle">Dispatcher</text>
    <text class="s" x="91" y="1044" text-anchor="middle">Fable</text>
    <text class="t" x="91" y="1060" text-anchor="middle">proposes rule edits</text>
  </g>
  <path class="loop" d="M166 1040H184"/>
  <g class="human">
    <rect class="box" x="184" y="1008" width="130" height="64" rx="8"/>
    <text class="n" x="249" y="1036" text-anchor="middle">You</text>
    <text class="t" x="249" y="1052" text-anchor="middle">decide</text>
  </g>
  <path class="loop" d="M249 1072V1090"/>
  <g class="muted">
    <rect class="box" x="16" y="1090" width="298" height="44" rx="8"/>
    <text class="n" x="165" y="1117" text-anchor="middle">rules for the next task</text>
  </g>
  <!-- the loop closes into the start of the flow -->
  <path class="loop" d="M16 1112H6V56H40"/>
</svg>
