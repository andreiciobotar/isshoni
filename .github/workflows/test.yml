name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only docs, assets or top-level Markdown skips the three heavy jobs below.
  # It is a job-level `if:`, not a workflow `paths:` filter: a skipped job reports success to branch
  # protection, while a skipped workflow leaves the required checks pending forever.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          echo "changed files:"; echo "$files"
          rc=0
          printf '%s' "$files" | grep -qvE '^(docs/|assets/|[^/]+\.md$)' || rc=$?
          if [ "$rc" = 1 ]; then
            echo "docs only: skipping the heavy jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code changes: running everything"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # the oldest version the code supports
      - run: make -j3 --output-sync=target test GOTESTFLAGS=-race

  # The README's path on a Linux machine, with the real scheduler and no Claude login.
  linux-walk:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make install
      - name: what the first Claude Code session would have created
        run: mkdir -p ~/.claude/projects
      - run: make snapshot
      - name: make up (three seconds in a pseudo-terminal, then q)
        run: (sleep 3; printf q) | script -qec "make up" /dev/null > /dev/null
      - run: make screenshot && test -s shots/dashboard-140x40.png
      - name: a systemd user session, as a logged-in user has
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          timeout 30 sh -c "until [ -S /run/user/$(id -u)/bus ]; do sleep 1; done"
      - run: tools/walk.sh
      - name: the cron fallback
        run: WALK_CRON=1 tools/walk.sh

  # The factory's image (docs/container.md): it builds, and inside it the same path passes with no
  # Claude login, the watch's ticks fired by the container's own cron.
  container:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: a state directory, with this checkout where a clone would be
        run: |
          state="$RUNNER_TEMP/state"
          mkdir -p "$state/home/code"
          cp -R . "$state/home/code/isshoni"
          { echo "FACTORY_STATE=$state"; echo "FACTORY_UID=$(id -u)"; echo "FACTORY_GID=$(id -g)"; } >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=docker/compose.yaml" >> "$GITHUB_ENV"
      - name: build, and report size and time
        run: |
          start=$(date +%s)
          docker compose build
          size=$(docker image inspect isshoni-factory --format '{{.Size}}')
          echo "image $((size / 1000000)) MB, built in $(($(date +%s) - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: docker compose up -d
      - name: not root, read-only root, no Docker socket, no privileges, limits applied
        run: |
          docker exec -i isshoni-factory sh -eux <<'EOF'
          test "$(id -u)" != 0
          awk '$2 == "/" { print $4 }' /proc/mounts | grep -q "^ro"
          test ! -e /var/run/docker.sock
          grep -qx "NoNewPrivs:[[:space:]]*1" /proc/self/status
          grep -qx "CapBnd:[[:space:]]*0*" /proc/self/status
          test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296
          test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
          test "$(cat /sys/fs/cgroup/cpu.max)" = "200000 100000"
          test "$(cat /sys/fs/cgroup/pids.max)" = 1024
          claude --version; gh --version; go version; python3 --version; tmux -V; openssl version
          EOF
      - name: start the watch's life in the background, its cron ticks overlap the tests below
        run: |
          (docker exec -e CI=true -e WALK_DAEMON=1 isshoni-factory /state/home/code/isshoni/tools/walk.sh > "$RUNNER_TEMP/walk.log" 2>&1; echo $? > "$RUNNER_TEMP/walk.status") &
      - run: docker exec isshoni-factory make -C /state/home/code/isshoni install
      - run: docker exec isshoni-factory make -C /state/home/code/isshoni test
      - run: docker exec isshoni-factory sh -c 'mkdir -p ~/.claude/projects && make -C ~/code/isshoni snapshot'
      - name: make up (three seconds in a pseudo-terminal, then q)
        run: docker exec isshoni-factory sh -c 'cd ~/code/isshoni && (sleep 3; printf q) | script -qec "make up" /dev/null > /dev/null'
      - name: the watch's life, each tick fired by supercronic
        id: watch
        run: |
          timeout 240 sh -c 'until [ -e "$1" ]; do sleep 1; done' sh "$RUNNER_TEMP/walk.status" || echo "the walk did not finish in 240 s"
          cat "$RUNNER_TEMP/walk.log"
          test "$(cat "$RUNNER_TEMP/walk.status")" = 0
      - name: a key for the dashboard over SSH, which the container starts serving when it is recreated
        run: |
          mkdir -p "$RUNNER_TEMP/state/home/.claude/factory/dashboard"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/viewer"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/stranger"
          cp "$RUNNER_TEMP/viewer.pub" "$RUNNER_TEMP/state/home/.claude/factory/dashboard/authorized_keys"
      - name: a recreated container finds its state
        run: |
          docker compose up -d --force-recreate
          docker exec isshoni-factory sh -c 'test -x ~/code/isshoni/bin/isshoni-tui && test -d ~/go/pkg/mod && test -s ~/.claude/factory/watch.log'
      - name: the dashboard over SSH, for the listed key and not for another
        run: |
          timeout 30 sh -c 'until docker logs isshoni-factory 2>&1 | grep -q "serving ssh on"; do sleep 1; done'
          ssh_opts="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o BatchMode=yes -p 2222"
          (sleep 3; printf q) | timeout 20 ssh -tt $ssh_opts -i "$RUNNER_TEMP/viewer" 127.0.0.1 > "$RUNNER_TEMP/dashboard.txt"
          grep -aq Sessions "$RUNNER_TEMP/dashboard.txt"
          if (sleep 1; printf q) | timeout 20 ssh -tt $ssh_opts -i "$RUNNER_TEMP/stranger" 127.0.0.1 > /dev/null 2> "$RUNNER_TEMP/stranger.err"; then
            echo "a key that is not listed got in"; exit 1
          fi
          grep -q 'Permission denied (publickey)' "$RUNNER_TEMP/stranger.err"
      - if: always() && steps.watch.outcome == 'skipped'
        run: cat "$RUNNER_TEMP/walk.log"
      - if: always()
        run: docker logs isshoni-factory

  # launchd for real, off anyone's own machine.
  macos-walk:
    runs-on: macos-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: tools/walk.sh
